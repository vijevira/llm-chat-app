<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#11141c"/>
      <stop offset="100%" stop-color="#181c28"/>
    </linearGradient>

    <!-- Gemini Multi-Stop Gradient -->
    <linearGradient id="geminiSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="35%" stop-color="#9B72CF"/>
      <stop offset="70%" stop-color="#D96570"/>
      <stop offset="100%" stop-color="#1BA1E3"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B72CF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9B72CF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="280" cy="240" r="320" fill="url(#glowBlue)"/>
  <circle cx="920" cy="380" r="300" fill="url(#glowPurple)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Logo Group -->
  <g transform="translate(110, 100)">
    <!-- App Icon Squircle -->
    <rect x="0" y="0" width="88" height="88" rx="26" fill="#1e2230" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    <path d="M44 14 C44 30.5 30.5 44 14 44 C30.5 44 44 57.5 44 74 C44 57.5 57.5 44 74 44 C57.5 44 44 30.5 44 14 Z" fill="url(#geminiSparkleGrad)"/>
    <path d="M62 20 C62 24.5 57.5 29 53 29 C57.5 29 62 33.5 62 38 C62 33.5 66.5 29 71 29 C66.5 29 62 24.5 62 20 Z" fill="#9B72CF" opacity="0.9"/>

    <!-- App Name Title -->
    <text x="110" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-0.5px">Omni Chat</text>
    <text x="330" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#9B72CF" letter-spacing="1px">v1.0.0</text>
  </g>

  <!-- Main Headline -->
  <text x="110" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1px">
    Universal AI Chat Interface
  </text>
  <text x="110" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="500" fill="#94a3b8">
    Access 500+ LLMs with Multimodal Creation &amp; Cloud Sync
  </text>

  <!-- Feature Pills Grid -->
  <g transform="translate(110, 400)">
    <!-- Pill 1: Gemini 2.5 -->
    <rect x="0" y="0" width="190" height="46" rx="23" fill="rgba(66, 133, 244, 0.15)" stroke="rgba(66, 133, 244, 0.35)" stroke-width="1.2"/>
    <text x="22" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#60a5fa">✨ Gemini 2.5 Flash</text>

    <!-- Pill 2: GPT-4o & o1 -->
    <rect x="205" y="0" width="165" height="46" rx="23" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.2"/>
    <text x="227" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#34d399">⚡ GPT-4o &amp; o1</text>

    <!-- Pill 3: Claude 3.5 Sonnet -->
    <rect x="385" y="0" width="200" height="46" rx="23" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.2"/>
    <text x="407" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#fbbf24">🧠 Claude 3.5 Sonnet</text>

    <!-- Pill 4: DeepSeek R1 -->
    <rect x="600" y="0" width="175" height="46" rx="23" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1.2"/>
    <text x="622" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#a78bfa">🔬 DeepSeek R1</text>

    <!-- Pill 5: Images & Videos -->
    <rect x="790" y="0" width="185" height="46" rx="23" fill="rgba(236, 72, 153, 0.15)" stroke="rgba(236, 72, 153, 0.35)" stroke-width="1.2"/>
    <text x="812" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f472b6">🎨 Image • Video • Audio</text>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(110, 520)">
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#64748b">
      Deploy on <tspan fill="#38bdf8">omni.endra.in</tspan> • Zero API Keys • 100% Free Cloud Sync
    </text>
  </g>
</svg>
